name: Build

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3-venv

      - name: Build and test bkasm
        working-directory: bkasm
        run: |
          cmake -S Build -B build
          cmake --build build --target run_tests

      - name: Upload bkasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkasm
          path: bkasm/build/bkasm

      - name: Build and test rkaexchange
        working-directory: rkaexchange
        run: |
          cmake -S . -B build
          cmake --build build --target run_tests

      - name: Upload rkaexchange artifact
        uses: actions/upload-artifact@v4
        with:
          name: rkaexchange
          path: rkaexchange/build/rkaexchange
